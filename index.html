<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Protipo Pokedex</title>
		<link rel="stylesheet" href="style.css">
	</head>
	<body>
		<header class="header">
			<div class="logo"></div>
			<ul class="menu">
				<li>Inicio</li>
				<li>Favoritos</li>
				<li>Sobre</li>
				<li>Registrar-se</li>
				<li>Login</li>
			</ul>
		</header>
		<section class="grade_pesquisa">
			<div class="caixa_pesquisa">
				<input class="pesquisa" type="text" placeholder="Pesquisar pokemon...">
				<button class="procurar">Procurar</button>
			</div>
			<div class="filtros_pesquisa">
				<h1>FILTROS</h1>
			</div>
			<div class="tipos">
				<button class="tipo">FIRE</button>
				<button class="tipo">WATER</button>
				<button class="tipo">GRASS</button>
				<button class="tipo">ELECTRIC</button>
				<button class="tipo">ROCK</button>
				<button class="tipo">POISON</button>
				<button class="tipo">GHOST</button>
				<button class="tipo">BUG</button>
			</div>
		</section>
		<main class="grade">
		</main>
		<footer>
		</footer>
	</body>
</html>
